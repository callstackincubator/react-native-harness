name: React Native Harness
description: Run React Native Harness tests on iOS, Android, Web or Windows
inputs:
  runner:
    description: The runner to use (must match a runner name defined in your harness config)
    required: true
    type: string
  app:
    description: >-
      The path to the built app (.app for iOS, .apk for Android). Not required
      for web, or for Windows (deploy the app with `react-native run-windows`
      before this action runs).
    required: false
    type: string
  projectRoot:
    description: The project root directory
    required: false
    type: string
  uploadVisualTestArtifacts:
    description: Whether to upload visual test diff and actual images as artifacts
    required: false
    type: boolean
    default: 'true'
  harnessArgs:
    description: Additional arguments to pass to the Harness CLI
    required: false
    type: string
    default: ''
  packageManager:
    description: Package manager to use instead of auto-detection (npm, yarn, pnpm, bun, or deno)
    required: false
    type: string
    default: ''
  cacheAvd:
    description: Whether to cache the AVD
    required: false
    type: boolean
    default: 'true'
  preRunHook:
    description: Shell script to run in bash immediately before Harness starts
    required: false
    type: string
    default: ''
  afterRunHook:
    description: Shell script to run in bash immediately after Harness finishes
    required: false
    type: string
    default: ''
  cacheSavePolicy:
    description: When to save a new Metro cache entry ('default-branch', 'always', or 'never')
    required: false
    type: string
    default: 'default-branch'
runs:
  using: 'composite'
  steps:
    - name: Detect Package Manager
      id: detect-pm
      shell: bash
      working-directory: ${{ inputs.projectRoot || '.' }}
      run: |
        if [ -n "${{ inputs.packageManager }}" ]; then
          case "${{ inputs.packageManager }}" in
            pnpm)
              echo "manager=pnpm" >> $GITHUB_OUTPUT
              echo "runner=pnpm exec " >> $GITHUB_OUTPUT
              ;;
            yarn)
              echo "manager=yarn" >> $GITHUB_OUTPUT
              echo "runner=yarn " >> $GITHUB_OUTPUT
              ;;
            bun)
              echo "manager=bun" >> $GITHUB_OUTPUT
              echo "runner=bunx " >> $GITHUB_OUTPUT
              ;;
            deno)
              echo "manager=deno" >> $GITHUB_OUTPUT
              echo "runner=deno run -A npm:" >> $GITHUB_OUTPUT
              ;;
            npm)
              echo "manager=npm" >> $GITHUB_OUTPUT
              echo "runner=npx " >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Error: Unsupported packageManager '${{ inputs.packageManager }}'"
              echo "Supported values: npm, yarn, pnpm, bun, deno"
              exit 1
              ;;
          esac
        elif [ -f "pnpm-lock.yaml" ]; then
          echo "manager=pnpm" >> $GITHUB_OUTPUT
          echo "runner=pnpm exec " >> $GITHUB_OUTPUT
        elif [ -f "yarn.lock" ]; then
          echo "manager=yarn" >> $GITHUB_OUTPUT
          echo "runner=yarn " >> $GITHUB_OUTPUT
        elif [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
          echo "manager=bun" >> $GITHUB_OUTPUT
          echo "runner=bunx " >> $GITHUB_OUTPUT
        elif [ -f "deno.lock" ]; then
          echo "manager=deno" >> $GITHUB_OUTPUT
          echo "runner=deno run -A npm:" >> $GITHUB_OUTPUT
        else
          echo "manager=npm" >> $GITHUB_OUTPUT
          echo "runner=npx " >> $GITHUB_OUTPUT
        fi
    # This action invokes the project's own installed react-native-harness CLI
    # (via `harness ci ...`) instead of shipping bundled scripts, so a CLI
    # that predates that interface must be rejected before it's ever
    # invoked. On such a CLI, `harness ci load-config` falls through to the
    # Jest CLI and treats `ci` as a test path pattern -- silently running
    # (zero) tests instead of failing -- so this guard must run before any
    # `harness ci ...` step, and it must NOT probe support by invoking
    # `harness ci` itself and inspecting the result.
    - name: Verify react-native-harness supports this action's CLI interface
      shell: bash
      working-directory: ${{ inputs.projectRoot || '.' }}
      run: |
        # Support is detected via an explicit capability marker
        # (harnessActionProtocol) on the 'react-native-harness' package.json,
        # not by comparing version numbers: a version floor can't be
        # satisfied by the very release that introduces the capability it
        # requires (this repo's own pre-release CI installs the in-tree
        # workspace version), and it would also reject semver-correct
        # prereleases of that release. Bump REQUIRED_PROTOCOL only when a
        # change to the `harness ci` contract is breaking for this action.
        REQUIRED_PROTOCOL=1
        INSTALLED_VERSION=$(node -p "require(require.resolve('react-native-harness/package.json',{paths:[process.cwd()]})).version" 2>/dev/null)
        if [ -z "$INSTALLED_VERSION" ]; then
          echo "Error: could not resolve the 'react-native-harness' package in this project."
          echo "Pin the action ref to the same release as the installed react-native-harness package."
          exit 1
        fi
        PROTOCOL=$(node -p "require(require.resolve('react-native-harness/package.json',{paths:[process.cwd()]})).harnessActionProtocol || 0" 2>/dev/null)
        if [ -z "$PROTOCOL" ]; then
          PROTOCOL=0
        fi
        if [ "$PROTOCOL" -lt "$REQUIRED_PROTOCOL" ]; then
          echo "Error: the installed react-native-harness ($INSTALLED_VERSION) predates this action's CLI-based interface (harness ci)."
          echo "Align the action ref with the react-native-harness version installed in this project."
          exit 1
        fi
    - name: Load React Native Harness configuration
      id: load-config
      shell: bash
      working-directory: ${{ inputs.projectRoot || '.' }}
      env:
        INPUT_RUNNER: ${{ inputs.runner }}
        INPUT_PROJECTROOT: ${{ inputs.projectRoot }}
        HARNESS_AVD_CACHING: ${{ inputs.cacheAvd }}
      run: |
        ${{ steps.detect-pm.outputs.runner }}react-native-harness ci load-config
    - name: Verify native app input
      # Windows, like web, takes no `app` path: the harness launches an
      # already-deployed MSIX package by its identity.
      if: ${{ fromJson(steps.load-config.outputs.config).platformId != 'web' && fromJson(steps.load-config.outputs.config).platformId != 'windows' }}
      shell: bash
      run: |
        if [ -z "${{ inputs.app }}" ]; then
          echo "Error: app input is required for native runners"
          echo "Please provide the path to the built app (.apk for Android, .app for iOS)"
          exit 1
        fi
    - name: Plan Metro cache restore
      id: plan-metro-restore
      shell: bash
      working-directory: ${{ steps.load-config.outputs.projectRoot }}
      env:
        INPUT_PROJECTROOT: ${{ steps.load-config.outputs.projectRoot }}
      run: |
        ${{ steps.detect-pm.outputs.runner }}react-native-harness ci plan-metro-restore
    - name: Restore Metro cache (.harness/cache/metro)
      id: restore-metro
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ steps.load-config.outputs.projectRoot }}/.harness/cache/metro
          ${{ steps.load-config.outputs.projectRoot }}/.harness/cache/metro-file-map
        key: ${{ steps.plan-metro-restore.outputs.metroRestoreKey }}
        # The '\n' here is a literal newline embedded via YAML double-quote
        # escaping (not a GitHub Actions expression escape -- expression
        # string literals don't interpret backslash sequences), so join()
        # actually separates entries onto their own lines, as actions/cache
        # requires for restore-keys.
        restore-keys: "${{ join(fromJson(steps.plan-metro-restore.outputs.metroRestorePrefixes), '\n') }}"
    # Must run after "Restore Metro cache" so this reflects what was actually
    # restored (empty on a cache miss), not the always-empty pre-restore state.
    - name: Snapshot Metro cache
      id: snapshot-metro-restore
      shell: bash
      working-directory: ${{ steps.load-config.outputs.projectRoot }}
      env:
        INPUT_PROJECTROOT: ${{ steps.load-config.outputs.projectRoot }}
        # Empty on a cache miss; snapshot-metro.cjs uses it to report whether
        # the Metro cache was actually restored and from which key.
        METRO_RESTORED_KEY: ${{ steps.restore-metro.outputs.cache-matched-key }}
      run: |
        ${{ steps.detect-pm.outputs.runner }}react-native-harness ci snapshot-metro
    - name: Restore Harness cache
      id: cache-harness-restore
      if: fromJson(steps.load-config.outputs.config).platformId == 'ios'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.load-config.outputs.projectRoot }}/.harness/cache/xctest-agent-simulator-*
        key: harness-ios-${{ runner.os }}-${{ hashFiles(format('{0}/.harness/cache/**/cache.json', steps.load-config.outputs.projectRoot)) }}
        restore-keys: |
          harness-ios-${{ runner.os }}-

    # ── iOS ──────────────────────────────────────────────────────────────────
    # iOS simulator boot and app installation are handled by Harness itself.
    # ── Android ──────────────────────────────────────────────────────────────
    - name: Verify Android config
      if: ${{ fromJson(steps.load-config.outputs.config).platformId == 'android' && fromJson(steps.load-config.outputs.config).config.device.type == 'emulator' }}
      shell: bash
      run: |
        if [ '${{ fromJson(steps.load-config.outputs.config).config.device.avd }}' = 'null' ]; then
          echo "Error: AVD config is required for Android emulators"
          echo "Please define the 'avd' property in the runner config"
          exit 1
        fi
    - name: Get architecture of the runner
      id: arch
      if: ${{ fromJson(steps.load-config.outputs.config).platformId == 'android' && fromJson(steps.load-config.outputs.config).config.device.type == 'emulator' }}
      shell: bash
      run: |
        case "${{ runner.arch }}" in
          X64)
            echo "arch=x86_64" >> $GITHUB_OUTPUT
            ;;
          ARM64)
            echo "arch=arm64-v8a" >> $GITHUB_OUTPUT
            ;;
          ARM32)
            echo "arch=armeabi-v7a" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "arch=x86_64" >> $GITHUB_OUTPUT
            ;;
        esac
    - name: Enable KVM group perms
      if: ${{ fromJson(steps.load-config.outputs.config).platformId == 'android' && fromJson(steps.load-config.outputs.config).config.device.type == 'emulator' }}
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls /dev/kvm
    - name: Compute AVD cache key
      id: avd-key
      if: ${{ fromJson(steps.load-config.outputs.config).platformId == 'android' && fromJson(steps.load-config.outputs.config).config.device.type == 'emulator' && fromJson(steps.load-config.outputs.config).action.avdCachingEnabled }}
      shell: bash
      run: |
        CACHE_CONFIG='${{ toJson(fromJson(steps.load-config.outputs.config).action.avdCacheConfig) }}'
        AVD_CONFIG_HASH=$(printf '%s' "$CACHE_CONFIG" | sha256sum | cut -d' ' -f1)
        AVD_NAME='${{ fromJson(steps.load-config.outputs.config).config.device.name }}'
        ARCH="${{ steps.arch.outputs.arch }}"
        CACHE_KEY="avd-$AVD_NAME-$ARCH-$AVD_CONFIG_HASH"
        echo "key=$CACHE_KEY" >> $GITHUB_OUTPUT
    - name: Restore AVD cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: avd-cache
      if: ${{ fromJson(steps.load-config.outputs.config).platformId == 'android' && fromJson(steps.load-config.outputs.config).config.device.type == 'emulator' && fromJson(steps.load-config.outputs.config).action.avdCachingEnabled }}
      with:
        path: |
          ~/.android/avd
          ~/.android/adb*
        key: ${{ steps.avd-key.outputs.key }}
    # ── Web ──────────────────────────────────────────────────────────────────
    - name: Install Playwright Browsers
      if: fromJson(steps.load-config.outputs.config).platformId == 'web'
      shell: bash
      run: npx playwright install --with-deps chromium
    # ── Windows ──────────────────────────────────────────────────────────────
    # Nothing to set up here: run the workflow on a `windows-*` runner and
    # deploy the app with `react-native run-windows --no-launch` in an earlier
    # step. The harness launches the deployed package and tracks its process.

    # ── Shared ───────────────────────────────────────────────────────────────
    - name: Run E2E tests
      id: run-tests
      shell: bash
      working-directory: ${{ steps.load-config.outputs.projectRoot }}
      env:
        PRE_RUN_HOOK: ${{ inputs.preRunHook }}
        AFTER_RUN_HOOK: ${{ inputs.afterRunHook }}
        HARNESS_RUNNER: ${{ inputs.runner }}
        HARNESS_APP_PATH: ${{ inputs.app }}
        HARNESS_AVD_CACHING: ${{ inputs.cacheAvd }}
      run: |
        # `pwd -W` prints the native Windows path under Git Bash, so child
        # processes get `D:/...` rather than an unusable `/d/...` msys path;
        # it fails on Linux/macOS, where plain `pwd` is already correct.
        export HARNESS_PROJECT_ROOT="$(pwd -W 2>/dev/null || pwd)"

        set +e
        ${{ steps.detect-pm.outputs.runner }}react-native-harness --harnessRunner ${{ inputs.runner }} ${{ inputs.harnessArgs }}
        harness_exit_code=$?
        set -e

        echo "harness_exit_code=$harness_exit_code" >> "$GITHUB_OUTPUT"

        if [ "$harness_exit_code" -ne 0 ]; then
          exit "$harness_exit_code"
        fi
    - name: Upload visual test artifacts
      if: always() && inputs.uploadVisualTestArtifacts == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: visual-test-diffs-${{ fromJson(steps.load-config.outputs.config).platformId }}
        path: |
          ${{ steps.load-config.outputs.projectRoot }}/**/__image_snapshots__/**/*-diff.png
          ${{ steps.load-config.outputs.projectRoot }}/**/__image_snapshots__/**/*-actual.png
        if-no-files-found: ignore
    - name: Save AVD cache
      if: ${{ always() && fromJson(steps.load-config.outputs.config).platformId == 'android' && fromJson(steps.load-config.outputs.config).config.device.type == 'emulator' && fromJson(steps.load-config.outputs.config).action.avdCachingEnabled && steps.avd-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.android/avd
          ~/.android/adb*
        key: ${{ steps.avd-key.outputs.key }}
    - name: Save Harness cache
      if: ${{ always() && fromJson(steps.load-config.outputs.config).platformId == 'ios' && steps.cache-harness-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.load-config.outputs.projectRoot }}/.harness/cache/xctest-agent-simulator-*
        key: ${{ steps.cache-harness-restore.outputs.cache-primary-key }}
    - name: Plan Metro cache save
      id: plan-metro-save
      if: always()
      shell: bash
      working-directory: ${{ steps.load-config.outputs.projectRoot }}
      env:
        INPUT_PROJECTROOT: ${{ steps.load-config.outputs.projectRoot }}
        INPUT_METRO_SNAPSHOT: ${{ steps.snapshot-metro-restore.outputs.metroSnapshot }}
        INPUT_CACHESAVEPOLICY: ${{ inputs.cacheSavePolicy }}
        IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
      run: |
        ${{ steps.detect-pm.outputs.runner }}react-native-harness ci plan-metro-save
    - name: Save Metro cache
      if: always() && steps.plan-metro-save.outputs.metroShouldSave == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ steps.load-config.outputs.projectRoot }}/.harness/cache/metro
          ${{ steps.load-config.outputs.projectRoot }}/.harness/cache/metro-file-map
        key: ${{ steps.plan-metro-save.outputs.metroSaveKey }}
    - name: Upload crash report artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: harness-crash-reports-${{ fromJson(steps.load-config.outputs.config).platformId }}
        path: ${{ steps.load-config.outputs.projectRoot }}/.harness/crash-reports/**/*
        if-no-files-found: ignore
