name: Simulator boot benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-boot:
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - iOS-26-2
          - iOS-26-4
          - iOS-26-5

    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Select Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select \
            --switch /Applications/Xcode_26.6.app/Contents/Developer

          xcodebuild -version

          echo "SIMULATOR_CACHE_KEY=core-simulator-device-ios-26-5-xcode-26-6-${ImageOS}-${ImageVersion}" >> "$GITHUB_ENV"

      - name: Restore iOS 26.5 simulator cache
        id: cache-ios-26-5-restore
        if: matrix.runtime == 'iOS-26-5'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Developer/CoreSimulator/Devices/FD9EC0F9-63AA-4C2F-B0F5-224AAE68866E
          key: ${{ env.SIMULATOR_CACHE_KEY }}

      - name: Inspect available simulators
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Measure existing simulator boot
        shell: bash
        env:
          RUNTIME_SUFFIX: ${{ matrix.runtime }}
          DEVICE_NAME: iPhone 17 Pro
          # Seconds to let the simulator settle after bootstatus completes
          # before taking the post-boot snapshot (daemons/SpringBoard/widgets
          # keep spawning for a while after "boot" reports done).
          SETTLE_SECONDS: '60'
        run: |
          set -euo pipefail

          RUNTIME_ID="com.apple.CoreSimulator.SimRuntime.${RUNTIME_SUFFIX}"
          BOOT_LOG="$RUNNER_TEMP/bootstatus-${RUNTIME_SUFFIX}.log"
          PREBOOT_LOG="$RUNNER_TEMP/mem-preboot-${RUNTIME_SUFFIX}.log"
          POSTBOOT_LOG="$RUNNER_TEMP/mem-postboot-${RUNTIME_SUFFIX}.log"
          SETTLE_LOG="$RUNNER_TEMP/mem-settle-${RUNTIME_SUFFIX}.log"
          PROC_LOG="$RUNNER_TEMP/mem-proc-postboot-${RUNTIME_SUFFIX}.log"
          PAGE=16384

          # ---- memory snapshot helpers ------------------------------------
          # phys_footprint via top's PhysMem summary (no RSS shared-page
          # double-count); vm_stat page counters for the honest breakdown.
          phys_used_mb() {
            top -l 1 -n 0 | awk '/PhysMem/ {
              v=$2; u=tolower(substr(v,length(v),1));
              n=substr(v,1,length(v)-1)+0;
              if (u=="g") n*=1024;
              printf "%d\n", n; exit
            }'
          }
          vm_pages() {  # $1 = key regex -> page count
            vm_stat | awk -v k="$1" -F: '$0 ~ k { gsub(/[^0-9]/,"",$2); print $2; exit }'
          }
          swap_used_mb() {
            sysctl -n vm.swapusage | sed -n 's/.*used = \([0-9.]*\)M.*/\1/p'
          }
          nprocs() { ps -A | wc -l | tr -d ' '; }

          snapshot() {  # $1=label $2=outfile
            {
              echo "=== $1 $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
              echo "nprocs=$(nprocs)"
              echo "phys_used_mb=$(phys_used_mb)"
              echo "pages_free=$(vm_pages 'Pages free')"
              echo "pages_wired=$(vm_pages 'Pages wired down')"
              echo "pages_compressor=$(vm_pages 'occupied by compressor')"
              echo "pages_anon=$(vm_pages 'Anonymous pages')"
              echo "swap_used_mb=$(swap_used_mb)"
              echo "--- vm.swapusage ---"; sysctl -n vm.swapusage
              echo "--- vm_stat ---"; vm_stat
              echo "--- top summary ---"; top -l 1 -n 0 | grep -E 'PhysMem|Processes' || true
            } | tee "$2"
          }
          getval() { grep -m1 "^$2=" "$1" | cut -d= -f2; }

          echo "Looking for:"
          echo "  Runtime: $RUNTIME_ID"
          echo "  Device:  $DEVICE_NAME"

          # Verify that the requested runtime is installed.
          if ! xcrun simctl list runtimes -j |
            jq -e --arg runtime "$RUNTIME_ID" '
              .runtimes[]
              | select(
                  .identifier == $runtime
                  and .isAvailable == true
                )
            ' >/dev/null; then
            echo "::error::Runtime $RUNTIME_ID is not available"
            exit 1
          fi

          # Select an existing available device only.
          UDID="$(
            xcrun simctl list devices available -j |
              jq -er \
                --arg runtime "$RUNTIME_ID" \
                --arg name "$DEVICE_NAME" '
                  .devices[$runtime]
                  | map(
                      select(
                        .name == $name
                        and .isAvailable == true
                      )
                    )
                  | .[0].udid
                '
          )" || {
            echo "::error::No existing $DEVICE_NAME found for $RUNTIME_ID"
            echo "Available devices:"
            xcrun simctl list devices available
            exit 1
          }

          echo "Selected existing simulator:"
          echo "  $DEVICE_NAME"
          echo "  $RUNTIME_ID"
          echo "  $UDID"

          # Clean baseline: make sure NO simulator is running before we snapshot
          # pre-boot memory, so the pre/post delta reflects only this device.
          xcrun simctl shutdown all 2>/dev/null || true
          sleep 5

          HW_NCPU="$(sysctl -n hw.ncpu)"
          HW_MEM_MB="$(( $(sysctl -n hw.memsize) / 1048576 ))"
          echo "host: ${HW_NCPU} vCPU, ${HW_MEM_MB} MB RAM"

          echo "=== Pre-boot memory snapshot ==="
          snapshot "PRE-BOOT" "$PREBOOT_LOG"

          START_SECONDS="$(date +%s)"

          echo "=== Boot request ==="
          time xcrun simctl boot "$UDID"

          echo "=== Boot completion ==="
          set +e
          xcrun simctl bootstatus "$UDID" -b 2>&1 |
            tee "$BOOT_LOG"
          BOOT_STATUS="${PIPESTATUS[0]}"
          set -e

          END_SECONDS="$(date +%s)"
          ELAPSED_SECONDS="$((END_SECONDS - START_SECONDS))"

          # Settle: sample memory every 5s so we can see it plateau before the
          # final post-boot snapshot. Written to an artifact for the full curve.
          echo "=== Settle (${SETTLE_SECONDS}s) ==="
          : > "$SETTLE_LOG"
          SETTLE_ITERS="$(( SETTLE_SECONDS / 5 ))"
          for i in $(seq 1 "$SETTLE_ITERS"); do
            LINE="t=$(( i * 5 ))s nprocs=$(nprocs) phys_used_mb=$(phys_used_mb) pages_free=$(vm_pages 'Pages free') pages_compressor=$(vm_pages 'occupied by compressor')"
            echo "$LINE" | tee -a "$SETTLE_LOG"
            sleep 5
          done

          echo "=== Post-boot memory snapshot ==="
          snapshot "POST-BOOT" "$POSTBOOT_LOG"

          # Per-process physical footprint post-boot (for attribution within
          # the simulator: SimRenderServer, SpringBoard, widget/poster swarm...).
          top -l 1 -o mem -n 60 -stats pid,mem,command > "$PROC_LOG" 2>&1 || true

          MIGRATION_SAMPLES="$(
            grep -c "Waiting on Data Migration" "$BOOT_LOG" || true
          )"

          # ---- deltas -----------------------------------------------------
          PRE_PHYS="$(getval "$PREBOOT_LOG" phys_used_mb)";       PRE_PHYS="${PRE_PHYS:-0}"
          POST_PHYS="$(getval "$POSTBOOT_LOG" phys_used_mb)";     POST_PHYS="${POST_PHYS:-0}"
          PRE_FREE="$(getval "$PREBOOT_LOG" pages_free)";         PRE_FREE="${PRE_FREE:-0}"
          POST_FREE="$(getval "$POSTBOOT_LOG" pages_free)";       POST_FREE="${POST_FREE:-0}"
          PRE_COMP="$(getval "$PREBOOT_LOG" pages_compressor)";   PRE_COMP="${PRE_COMP:-0}"
          POST_COMP="$(getval "$POSTBOOT_LOG" pages_compressor)"; POST_COMP="${POST_COMP:-0}"
          PRE_WIRED="$(getval "$PREBOOT_LOG" pages_wired)";       PRE_WIRED="${PRE_WIRED:-0}"
          POST_WIRED="$(getval "$POSTBOOT_LOG" pages_wired)";     POST_WIRED="${POST_WIRED:-0}"
          PRE_ANON="$(getval "$PREBOOT_LOG" pages_anon)";         PRE_ANON="${PRE_ANON:-0}"
          POST_ANON="$(getval "$POSTBOOT_LOG" pages_anon)";       POST_ANON="${POST_ANON:-0}"
          PRE_NPROC="$(getval "$PREBOOT_LOG" nprocs)";            PRE_NPROC="${PRE_NPROC:-0}"
          POST_NPROC="$(getval "$POSTBOOT_LOG" nprocs)";          POST_NPROC="${POST_NPROC:-0}"
          PRE_SWAP="$(getval "$PREBOOT_LOG" swap_used_mb)";       PRE_SWAP="${PRE_SWAP:-0}"
          POST_SWAP="$(getval "$POSTBOOT_LOG" swap_used_mb)";     POST_SWAP="${POST_SWAP:-0}"

          # Non-reclaimable memory demand = anonymous + wired + compressed.
          # This is the honest cost metric: it excludes file-backed cache (which
          # macOS elastically reclaims) and nets out the anon->compressor shuffle
          # that a memory-constrained box does under pressure. PhysMem "used" and
          # "free" are NOT cost proxies here -- they sit pinned near the RAM limit
          # because cache counts as "used", so their pre/post delta is ~0/noise.
          PRE_DEMAND_MB=$(( (PRE_ANON + PRE_WIRED + PRE_COMP) * PAGE / 1048576 ))
          POST_DEMAND_MB=$(( (POST_ANON + POST_WIRED + POST_COMP) * PAGE / 1048576 ))
          DEMAND_DELTA_MB=$(( POST_DEMAND_MB - PRE_DEMAND_MB ))
          DELTA_PHYS_MB=$(( POST_PHYS - PRE_PHYS ))
          COMP_DELTA_MB=$(( (POST_COMP - PRE_COMP) * PAGE / 1048576 ))
          WIRED_DELTA_MB=$(( (POST_WIRED - PRE_WIRED) * PAGE / 1048576 ))
          ANON_DELTA_MB=$(( (POST_ANON - PRE_ANON) * PAGE / 1048576 ))
          NPROC_DELTA=$(( POST_NPROC - PRE_NPROC ))

          {
            echo "### Simulator RAM cost — \`$RUNTIME_SUFFIX\`"
            echo
            echo "Host: **${HW_NCPU} vCPU / ${HW_MEM_MB} MB RAM** · image \`${ImageOS:-unknown}\` \`${ImageVersion:-unknown}\`"
            echo
            echo "**RAM cost of this simulator ≈ ${DEMAND_DELTA_MB} MB** (idle, settled ${SETTLE_SECONDS}s) — non-reclaimable demand delta (anon+wired+compressed)."
            echo
            echo "| Metric (MB) | Pre-boot | Post-boot | Delta |"
            echo "|---|--:|--:|--:|"
            echo "| **Demand (anon+wired+comp)** | ${PRE_DEMAND_MB} | ${POST_DEMAND_MB} | **${DEMAND_DELTA_MB}** |"
            echo "| ↳ Anonymous | $(( PRE_ANON * PAGE / 1048576 )) | $(( POST_ANON * PAGE / 1048576 )) | ${ANON_DELTA_MB} |"
            echo "| ↳ Wired | $(( PRE_WIRED * PAGE / 1048576 )) | $(( POST_WIRED * PAGE / 1048576 )) | ${WIRED_DELTA_MB} |"
            echo "| ↳ Compressed | $(( PRE_COMP * PAGE / 1048576 )) | $(( POST_COMP * PAGE / 1048576 )) | ${COMP_DELTA_MB} |"
            echo "| Swap used | ${PRE_SWAP} | ${POST_SWAP} | — |"
            echo "| Process count | ${PRE_NPROC} | ${POST_NPROC} | ${NPROC_DELTA} |"
            echo "| PhysMem used (cache-dominated, NOT a cost proxy) | ${PRE_PHYS} | ${POST_PHYS} | ${DELTA_PHYS_MB} |"
            echo
            echo "- Boot duration: **${ELAPSED_SECONDS}s** · migration samples: **${MIGRATION_SAMPLES}**"
            echo "- Full snapshots + settle curve + per-process footprint in artifact \`mem-boot-${RUNTIME_SUFFIX}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "demand_delta_mb=${DEMAND_DELTA_MB} phys_delta_mb=${DELTA_PHYS_MB} nproc_delta=${NPROC_DELTA} boot_seconds=${ELAPSED_SECONDS}"

          if [[ "$BOOT_STATUS" -ne 0 ]]; then
            echo "::error::Simulator failed to finish booting"
            exit "$BOOT_STATUS"
          fi

      - name: Upload memory snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mem-boot-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/mem-preboot-${{ matrix.runtime }}.log
            ${{ runner.temp }}/mem-postboot-${{ matrix.runtime }}.log
            ${{ runner.temp }}/mem-settle-${{ matrix.runtime }}.log
            ${{ runner.temp }}/mem-proc-postboot-${{ matrix.runtime }}.log
          if-no-files-found: warn

      - name: Shut down iOS 26.5 simulator before caching
        id: shutdown-ios-26-5
        if: always() && matrix.runtime == 'iOS-26-5'
        shell: bash
        run: |
          set -euo pipefail

          UDID="FD9EC0F9-63AA-4C2F-B0F5-224AAE68866E"
          xcrun simctl shutdown "$UDID" || true

          for _ in {1..30}; do
            if xcrun simctl list devices | grep -F "$UDID" | grep -q '(Shutdown)'; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::Simulator $UDID did not shut down before caching"
          exit 1

      - name: Save iOS 26.5 simulator cache
        if: always() && matrix.runtime == 'iOS-26-5' && steps.shutdown-ios-26-5.outcome == 'success' && steps.cache-ios-26-5-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Developer/CoreSimulator/Devices/FD9EC0F9-63AA-4C2F-B0F5-224AAE68866E
          key: ${{ steps.cache-ios-26-5-restore.outputs.cache-primary-key }}
