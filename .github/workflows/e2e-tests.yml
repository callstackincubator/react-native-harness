name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - web
          - vega
  pull_request:
    types: [ready_for_review]
    branches:
      - main
  # Builds the apps on main so pull requests, which can only read caches from
  # their own ref and the default branch, start from a cached app.
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# Toolchain settings. scripts/ci/native-fingerprint.mjs hashes them into the
# app cache keys, so a change here builds new apps.
env:
  XCODE_VERSION: '26.4.1'
  # The macOS runners are Apple silicon, so only arm64 is needed.
  IOS_ARCHS: arm64
  JAVA_VERSION: '17'
  # The CI emulator is x86_64, so skip compiling native code for the other
  # ABIs listed in gradle.properties.
  ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64

jobs:
  fingerprint:
    name: Native fingerprints
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'ios' }}
    outputs:
      android: ${{ steps.fingerprint.outputs.android }}
      ios: ${{ steps.fingerprint.outputs.ios }}
      ios-pods: ${{ steps.fingerprint.outputs.ios-pods }}
      android-hit: ${{ steps.android-lookup.outputs.cache-hit }}
      ios-hit: ${{ steps.ios-lookup.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Compute fingerprints
        id: fingerprint
        run: |
          for target in android ios ios-pods; do
            echo "::group::$target"
            hash="$(node scripts/ci/native-fingerprint.mjs apps/playground "$target" --debug)"
            echo "::endgroup::"
            echo "$target: $hash"
            echo "$target=$hash" >> "$GITHUB_OUTPUT"
          done

      - name: Look up Android app
        id: android-lookup
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-playground-${{ steps.fingerprint.outputs.android }}
          lookup-only: true

      - name: Look up iOS app
        id: ios-lookup
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ./apps/playground/ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          key: ios-app-playground-${{ steps.fingerprint.outputs.ios }}
          lookup-only: true

  build-android:
    name: Build Android app
    needs: fingerprint
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: ${{ needs.fingerprint.outputs.android-hit != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Build Android app
        working-directory: apps/playground
        run: |
          pnpm nx run @react-native-harness/playground:build-android --tasks=assembleDebug

      - name: Save APK to cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-playground-${{ needs.fingerprint.outputs.android }}

  build-ios:
    name: Build iOS app
    needs: fingerprint
    runs-on: macos-latest
    timeout-minutes: 30
    if: ${{ needs.fingerprint.outputs.ios-hit != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install dependencies
        run: |
          pnpm install

      # The keys come from the Linux fingerprint job; recomputing them here
      # catches a fingerprint that differs between the two runners.
      - name: Verify fingerprints
        run: |
          for target in ios ios-pods; do
            case "$target" in
              ios) expected='${{ needs.fingerprint.outputs.ios }}' ;;
              ios-pods) expected='${{ needs.fingerprint.outputs.ios-pods }}' ;;
            esac
            actual="$(node scripts/ci/native-fingerprint.mjs apps/playground "$target" --debug)"
            if [ "$actual" != "$expected" ]; then
              echo "::warning::$target fingerprint on macOS ($actual) differs from Linux ($expected)"
            else
              echo "$target fingerprint matches: $actual"
            fi
          done

      # Pods/ is keyed exactly on the CocoaPods inputs: restoring a sandbox
      # generated from another Podfile.lock can fail `pod install`. The
      # download cache holds only versioned pod sources, so any recent entry
      # is safe to reuse.
      - name: Restore Pods
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ./apps/playground/ios/Pods
          key: playground-pods-${{ needs.fingerprint.outputs.ios-pods }}

      - name: Restore CocoaPods download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-downloads-${{ hashFiles('./apps/playground/ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-downloads-

      - name: Install CocoaPods
        working-directory: apps/playground/ios
        run: |
          pod install

      - name: Build iOS app
        working-directory: apps/playground
        run: |
          pnpm react-native build-ios --buildFolder ./build --verbose --extra-params "ARCHS=$IOS_ARCHS"

      - name: Save app to cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ./apps/playground/ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          key: ios-app-playground-${{ needs.fingerprint.outputs.ios }}

  e2e-android:
    name: E2E Android
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [fingerprint, build-android]
    if: ${{ !cancelled() && needs.fingerprint.result == 'success' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') && ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'))) }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Reclaim disk space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Restore APK from cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-playground-${{ needs.fingerprint.outputs.android }}
          fail-on-cache-miss: true

      - name: Run React Native Harness
        uses: ./
        with:
          app: android/app/build/outputs/apk/debug/app-debug.apk
          runner: android
          projectRoot: apps/playground
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-logs-e2e-android
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-diagnostics-e2e-android
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  e2e-ios:
    name: E2E iOS
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [fingerprint, build-ios]
    if: ${{ !cancelled() && needs.fingerprint.result == 'success' && (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped') && ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'))) }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      # Spotlight starts indexing the checkout and node_modules on a fresh
      # runner and competes with the simulator for the runner's few cores.
      - name: Disable Spotlight indexing
        run: sudo mdutil -a -i off

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Starts the simulator boot now so it overlaps the network-bound install
      # steps below instead of the Metro bundle build. Harness reuses a booted
      # or booting simulator; if this fails, Harness boots it itself.
      - name: Boot iOS simulator
        env:
          SIMULATOR_NAME: iPhone 17 Pro
          SIMULATOR_RUNTIME: iOS-26-4
        run: |
          udid="$(xcrun simctl list devices --json | jq -r --arg name "$SIMULATOR_NAME" --arg runtime "$SIMULATOR_RUNTIME" \
            '.devices | to_entries[] | select(.key | endswith($runtime)) | .value[] | select(.name == $name) | .udid' | head -n 1)"
          if [ -z "$udid" ]; then
            echo "::warning::No $SIMULATOR_NAME simulator for $SIMULATOR_RUNTIME; Harness will report it."
            exit 0
          fi
          echo "Booting $SIMULATOR_NAME ($udid)"
          xcrun simctl boot "$udid" || echo "::warning::Could not pre-boot $udid; Harness will boot it."

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      # Packs prebuilt XCTest agent artifacts into the platform package and
      # fails if it cannot, so this job exercises the artifact path consumers
      # get from a published package rather than only the build fallback.
      - name: Pack XCTest agent artifacts
        working-directory: packages/platform-ios
        env:
          HARNESS_REQUIRE_XCTEST_PREBUILDS: '1'
        run: |
          node scripts/pack-xctest-agent-artifacts.mjs

      - name: Restore app from cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ./apps/playground/ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          key: ios-app-playground-${{ needs.fingerprint.outputs.ios }}
          fail-on-cache-miss: true

      - name: Run React Native Harness
        uses: ./
        with:
          app: ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          runner: ios
          projectRoot: apps/playground
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-logs-e2e-ios
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-diagnostics-e2e-ios
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  e2e-web:
    name: E2E Web
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'web')) }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Run React Native Harness
        uses: ./
        with:
          runner: chromium
          projectRoot: apps/playground
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-logs-e2e-web
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-diagnostics-e2e-web
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  crash-validate-android:
    name: Crash Validation Android
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [fingerprint, build-android]
    if: ${{ !cancelled() && needs.fingerprint.result == 'success' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') && (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android')) }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Reclaim disk space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Restore APK from cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-playground-${{ needs.fingerprint.outputs.android }}
          fail-on-cache-miss: true

      - name: Run React Native Harness (expect crash)
        id: crash-test
        continue-on-error: true
        uses: ./
        with:
          app: android/app/build/outputs/apk/debug/app-debug.apk
          runner: android-crash-pre-rn
          projectRoot: apps/playground
          harnessArgs: '--config jest.harness.crash.config.mjs --testPathPatterns src/__tests__/crash/android'
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Verify crash was detected
        shell: bash
        run: |
          if [ "${{ steps.crash-test.outcome }}" != "failure" ]; then
            echo "ERROR: Expected harness to fail (crash not detected)"
            exit 1
          fi
          echo "Crash was correctly detected by the harness"

      - name: Verify crash artifacts exist
        shell: bash
        run: |
          CRASH_DIR="apps/playground/.harness/crash-reports"
          if [ ! -d "$CRASH_DIR" ]; then
            echo "ERROR: No crash report directory found at $CRASH_DIR"
            exit 1
          fi

          ARTIFACT_COUNT="$(find "$CRASH_DIR" -mindepth 4 -type f | wc -l | tr -d ' ')"
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "ERROR: No nested crash report artifacts found in $CRASH_DIR"
            find "$CRASH_DIR" -maxdepth 4 -print
            exit 1
          fi

          echo "Crash report artifacts found:"
          find "$CRASH_DIR" -mindepth 4 -type f -print

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-logs-crash-validate-android
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-diagnostics-crash-validate-android
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  crash-validate-ios:
    name: Crash Validation iOS
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [fingerprint, build-ios]
    if: ${{ !cancelled() && needs.fingerprint.result == 'success' && (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped') && (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios')) }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      # Spotlight starts indexing the checkout and node_modules on a fresh
      # runner and competes with the simulator for the runner's few cores.
      - name: Disable Spotlight indexing
        run: sudo mdutil -a -i off

      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Starts the simulator boot now so it overlaps the network-bound install
      # steps below instead of the Metro bundle build. Harness reuses a booted
      # or booting simulator; if this fails, Harness boots it itself.
      - name: Boot iOS simulator
        env:
          SIMULATOR_NAME: iPhone 17 Pro
          SIMULATOR_RUNTIME: iOS-26-4
        run: |
          udid="$(xcrun simctl list devices --json | jq -r --arg name "$SIMULATOR_NAME" --arg runtime "$SIMULATOR_RUNTIME" \
            '.devices | to_entries[] | select(.key | endswith($runtime)) | .value[] | select(.name == $name) | .udid' | head -n 1)"
          if [ -z "$udid" ]; then
            echo "::warning::No $SIMULATOR_NAME simulator for $SIMULATOR_RUNTIME; Harness will report it."
            exit 0
          fi
          echo "Booting $SIMULATOR_NAME ($udid)"
          xcrun simctl boot "$udid" || echo "::warning::Could not pre-boot $udid; Harness will boot it."

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      # Packs prebuilt XCTest agent artifacts into the platform package and
      # fails if it cannot, so this job exercises the artifact path consumers
      # get from a published package rather than only the build fallback.
      - name: Pack XCTest agent artifacts
        working-directory: packages/platform-ios
        env:
          HARNESS_REQUIRE_XCTEST_PREBUILDS: '1'
        run: |
          node scripts/pack-xctest-agent-artifacts.mjs

      - name: Restore app from cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ./apps/playground/ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          key: ios-app-playground-${{ needs.fingerprint.outputs.ios }}
          fail-on-cache-miss: true

      - name: Run React Native Harness (expect crash)
        id: crash-test
        continue-on-error: true
        uses: ./
        with:
          app: ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          runner: ios-crash-pre-rn
          projectRoot: apps/playground
          harnessArgs: '--config jest.harness.crash.config.mjs --testPathPatterns src/__tests__/crash/ios'
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Verify crash was detected
        shell: bash
        run: |
          if [ "${{ steps.crash-test.outcome }}" != "failure" ]; then
            echo "ERROR: Expected harness to fail (crash not detected)"
            exit 1
          fi
          echo "Crash was correctly detected by the harness"

      - name: Verify crash artifacts exist
        shell: bash
        run: |
          CRASH_DIR="apps/playground/.harness/crash-reports"
          if [ ! -d "$CRASH_DIR" ]; then
            echo "ERROR: No crash report directory found at $CRASH_DIR"
            exit 1
          fi

          ARTIFACT_COUNT="$(find "$CRASH_DIR" -mindepth 4 -type f | wc -l | tr -d ' ')"
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "ERROR: No nested crash report artifacts found in $CRASH_DIR"
            find "$CRASH_DIR" -maxdepth 4 -print
            exit 1
          fi

          echo "Crash report artifacts found:"
          find "$CRASH_DIR" -mindepth 4 -type f -print

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-logs-crash-validate-ios
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-diagnostics-crash-validate-ios
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  e2e-vega:
    name: E2E Vega
    # Needs a self-hosted runner with the Vega SDK installed and the "vega"
    # label; GitHub-hosted images have no SDK, so this job is dispatch only.
    runs-on: [self-hosted, vega]
    timeout-minutes: 45
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'vega' }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Build the Vega app
        run: |
          source ~/vega/env
          pnpm --filter @react-native-harness/playground-vega build:debug

      - name: Run React Native Harness
        uses: ./
        with:
          runner: vega
          projectRoot: apps/playground-vega
          app: apps/playground-vega/build/${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}-debug/playground-vega_${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}.vpkg
