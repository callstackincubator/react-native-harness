name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - web
          - vega
  pull_request:
    types: [ready_for_review]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  e2e-android:
    name: E2E Android
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android')) }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Reclaim disk space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore APK from cache
        id: cache-apk-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-playground-x86_64-${{ hashFiles('pnpm-lock.yaml', 'apps/playground/package.json', 'apps/playground/android/**', 'apps/playground/src/specs/**', 'packages/ui/android/**', 'packages/ui/src/Native*.ts', 'packages/ui/package.json', 'packages/ui/react-native.config.cjs') }}

      - name: Build Android app
        if: steps.cache-apk-restore.outputs.cache-hit != 'true'
        working-directory: apps/playground
        env:
          # The CI emulator is x86_64, so skip compiling native code for the
          # other ABIs listed in gradle.properties.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
        run: |
          pnpm nx run @react-native-harness/playground:build-android --tasks=assembleDebug

      - name: Save APK to cache
        if: steps.cache-apk-restore.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: ${{ steps.cache-apk-restore.outputs.cache-primary-key }}

      - name: Run React Native Harness
        uses: ./
        with:
          app: android/app/build/outputs/apk/debug/app-debug.apk
          runner: android
          projectRoot: apps/playground
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-logs-e2e-android
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-diagnostics-e2e-android
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  e2e-ios:
    name: E2E iOS
    runs-on: macos-latest
    timeout-minutes: 30
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios')) }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Setup Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.4.1'

      - name: Install Watchman
        run: brew install watchman

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      # Packs prebuilt XCTest agent artifacts into the platform package and
      # fails if it cannot, so this job exercises the artifact path consumers
      # get from a published package rather than only the build fallback.
      - name: Pack XCTest agent artifacts
        working-directory: packages/platform-ios
        env:
          HARNESS_REQUIRE_XCTEST_PREBUILDS: '1'
        run: |
          node scripts/pack-xctest-agent-artifacts.mjs

      - name: Restore app from cache
        id: cache-app-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ./apps/playground/ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          key: ios-app-playground-xcode26.4.1-arm64-${{ hashFiles('pnpm-lock.yaml', 'apps/playground/package.json', 'apps/playground/ios/**', 'apps/playground/src/specs/**', 'packages/ui/ios/**', 'packages/ui/HarnessUI.podspec', 'packages/ui/Package.swift', 'packages/ui/src/Native*.ts', 'packages/ui/package.json', 'packages/ui/react-native.config.cjs') }}

      - name: CocoaPods cache
        if: steps.cache-app-restore.outputs.cache-hit != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ./apps/playground/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: playground-${{ runner.os }}-pods-${{ hashFiles('./apps/playground/ios/Podfile.lock') }}
          restore-keys: |
            playground-${{ runner.os }}-pods-

      - name: Install CocoaPods
        if: steps.cache-app-restore.outputs.cache-hit != 'true'
        working-directory: apps/playground/ios
        run: |
          pod install

      - name: Build iOS app
        if: steps.cache-app-restore.outputs.cache-hit != 'true'
        working-directory: apps/playground
        # The generic simulator destination builds every simulator arch; the
        # runner is Apple silicon, so only arm64 is needed.
        run: |
          pnpm react-native build-ios --buildFolder ./build --verbose --extra-params "ARCHS=arm64"

      - name: Save app to cache
        if: steps.cache-app-restore.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ./apps/playground/ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          key: ${{ steps.cache-app-restore.outputs.cache-primary-key }}

      - name: Run React Native Harness
        uses: ./
        with:
          app: ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          runner: ios
          projectRoot: apps/playground
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-logs-e2e-ios
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-diagnostics-e2e-ios
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  e2e-web:
    name: E2E Web
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'web')) }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Run React Native Harness
        uses: ./
        with:
          runner: chromium
          projectRoot: apps/playground
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-logs-e2e-web
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-diagnostics-e2e-web
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  crash-validate-android:
    name: Crash Validation Android
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android') }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Reclaim disk space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore APK from cache
        id: cache-apk-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-playground-x86_64-${{ hashFiles('pnpm-lock.yaml', 'apps/playground/package.json', 'apps/playground/android/**', 'apps/playground/src/specs/**', 'packages/ui/android/**', 'packages/ui/src/Native*.ts', 'packages/ui/package.json', 'packages/ui/react-native.config.cjs') }}

      - name: Build Android app
        if: steps.cache-apk-restore.outputs.cache-hit != 'true'
        working-directory: apps/playground
        env:
          # The CI emulator is x86_64, so skip compiling native code for the
          # other ABIs listed in gradle.properties.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
        run: |
          pnpm nx run @react-native-harness/playground:build-android --tasks=assembleDebug

      - name: Save APK to cache
        if: steps.cache-apk-restore.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: ${{ steps.cache-apk-restore.outputs.cache-primary-key }}

      - name: Run React Native Harness (expect crash)
        id: crash-test
        continue-on-error: true
        uses: ./
        with:
          app: android/app/build/outputs/apk/debug/app-debug.apk
          runner: android-crash-pre-rn
          projectRoot: apps/playground
          harnessArgs: '--config jest.harness.crash.config.mjs --testPathPatterns src/__tests__/crash/android'
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Verify crash was detected
        shell: bash
        run: |
          if [ "${{ steps.crash-test.outcome }}" != "failure" ]; then
            echo "ERROR: Expected harness to fail (crash not detected)"
            exit 1
          fi
          echo "Crash was correctly detected by the harness"

      - name: Verify crash artifacts exist
        shell: bash
        run: |
          CRASH_DIR="apps/playground/.harness/crash-reports"
          if [ ! -d "$CRASH_DIR" ]; then
            echo "ERROR: No crash report directory found at $CRASH_DIR"
            exit 1
          fi

          ARTIFACT_COUNT="$(find "$CRASH_DIR" -mindepth 4 -type f | wc -l | tr -d ' ')"
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "ERROR: No nested crash report artifacts found in $CRASH_DIR"
            find "$CRASH_DIR" -maxdepth 4 -print
            exit 1
          fi

          echo "Crash report artifacts found:"
          find "$CRASH_DIR" -mindepth 4 -type f -print

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-logs-crash-validate-android
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-diagnostics-crash-validate-android
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  crash-validate-ios:
    name: Crash Validation iOS
    runs-on: macos-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios') }}
