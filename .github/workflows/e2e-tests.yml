name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - web
  pull_request:
    types: [ready_for_review]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  e2e-android:
    name: E2E Android
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android')) }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Reclaim disk space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Install pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore APK from cache
        id: cache-apk-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-playground

      - name: Build Android app
        if: steps.cache-apk-restore.outputs.cache-hit != 'true'
        working-directory: apps/playground
        run: |
          pnpm nx run @react-native-harness/playground:build-android --tasks=assembleDebug

      - name: Save APK to cache
        if: steps.cache-apk-restore.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-playground

      - name: Run React Native Harness
        uses: ./
        with:
          app: android/app/build/outputs/apk/debug/app-debug.apk
          runner: android
          projectRoot: apps/playground
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-logs-e2e-android
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-diagnostics-e2e-android
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  e2e-ios:
    name: E2E iOS
    runs-on: macos-latest
    timeout-minutes: 30
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios')) }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Setup Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Install Watchman
        run: brew install watchman

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Restore app from cache
        id: cache-app-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ./apps/playground/ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          key: ios-app-playground

      - name: CocoaPods cache
        if: steps.cache-app-restore.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ./apps/playground/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: playground-${{ runner.os }}-pods-${{ hashFiles('./apps/playground/ios/Podfile.lock') }}
          restore-keys: |
            playground-${{ runner.os }}-pods-

      - name: Install CocoaPods
        if: steps.cache-app-restore.outputs.cache-hit != 'true'
        working-directory: apps/playground/ios
        run: |
          pod install

      - name: Build iOS app
        if: steps.cache-app-restore.outputs.cache-hit != 'true'
        working-directory: apps/playground
        run: |
          pnpm react-native build-ios --buildFolder ./build --verbose

      - name: Save app to cache
        if: steps.cache-app-restore.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ./apps/playground/ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          key: ios-app-playground

      # Free host RAM before Harness. On the 7 GB runner the host + an idle sim
      # already consume ~5.6 GB (measured), leaving no real headroom, so the
      # active app + XCTest + xcodebuild + Metro tip the box into compression and
      # swap. Here we reclaim what is SAFE to kill on a headless CI mac: Spotlight
      # indexing (mds/mds_stores -- also CPU-heavy) plus a conservative allowlist
      # of daemons/agents no CI build needs (crash/analytics/diagnostics/iCloud/
      # Siri/News/Tips/Photos). We deliberately DO NOT touch WindowServer,
      # CoreSimulator, security/codesign, cfprefsd or launchservicesd -- the
      # build/sign/render path needs them. Best-effort: every action is `|| true`
      # so a SIP-protected or absent service never fails the job. The `demand`
      # metric is anon+wired+compressed (the honest, cache-independent number).
      - name: Free host RAM before Harness
        shell: bash
        run: |
          set +e
          PAGE=16384
          vmp() { vm_stat | awk -v k="$1" -F: '$0 ~ k { gsub(/[^0-9]/,"",$2); print $2; exit }'; }
          demand_mb() { echo $(( ( $(vmp 'Anonymous pages') + $(vmp 'Pages wired down') + $(vmp 'occupied by compressor') ) * PAGE / 1048576 )); }
          UID_NUM="$(id -u)"

          top -l 1 -o mem -n 200 -stats pid,mem,command > "$RUNNER_TEMP/host-proc-before.log" 2>&1
          BEFORE_MB="$(demand_mb)"; BEFORE_N="$(ps -A | wc -l | tr -d ' ')"
          echo "before: demand=${BEFORE_MB}MB nprocs=${BEFORE_N}"

          # Spotlight: stop indexing (frees mds_stores + reclaims CPU).
          sudo mdutil -a -i off || true

          # System-domain daemons safe to remove on CI (no build/sign/render need).
          SYS_DAEMONS=(
            com.apple.metadata.mds
            com.apple.spotlightknowledged
            com.apple.ReportCrash
            com.apple.ReportCrash.Root
            com.apple.analyticsd
            com.apple.osanalytics.osanalyticshelper
            com.apple.diagnosticd
            com.apple.cloudd
            com.apple.bird
            com.apple.protectedcloudstorage.protectedcloudkeysyncing
            com.apple.AirPlayXPCHelper
            com.apple.bluetoothd
          )
          for L in "${SYS_DAEMONS[@]}"; do
            sudo launchctl bootout "system/$L" 2>/dev/null && echo "booted out system/$L" || true
          done

          # GUI/user-agent-domain services no CI build needs.
          GUI_AGENTS=(
            com.apple.suggestd
            com.apple.parsecd
            com.apple.knowledge-agent
            com.apple.assistantd
            com.apple.Siri.agent
            com.apple.newsd
            com.apple.tipsd
            com.apple.CoreLocationAgent
            com.apple.cloudphotod
            com.apple.photoanalysisd
          )
          for L in "${GUI_AGENTS[@]}"; do
            launchctl bootout "gui/$UID_NUM/$L" 2>/dev/null && echo "booted out gui/$UID_NUM/$L" || true
          done

          sleep 5
          top -l 1 -o mem -n 200 -stats pid,mem,command > "$RUNNER_TEMP/host-proc-after.log" 2>&1
          AFTER_MB="$(demand_mb)"; AFTER_N="$(ps -A | wc -l | tr -d ' ')"
          RECLAIM=$(( BEFORE_MB - AFTER_MB ))
          echo "after: demand=${AFTER_MB}MB nprocs=${AFTER_N} reclaimed=${RECLAIM}MB"

          {
            echo "### Host RAM freed before Harness"
            echo
            echo "- Non-reclaimable demand: **${BEFORE_MB} MB → ${AFTER_MB} MB** (reclaimed **${RECLAIM} MB**)"
            echo "- Process count: **${BEFORE_N} → ${AFTER_N}**"
            echo "- Spotlight indexing disabled; before/after host process dumps in artifact \`mem-pressure-e2e-ios\`"
          } >> "$GITHUB_STEP_SUMMARY"
          true

      # Two backgrounded samplers (persist across later steps via nohup):
      #  1. mem-pressure.log  - system swap/compressor/free every 2s (timeline)
      #  2. mem-proc.log      - `top -l1 -o mem` every 10s: honest per-process
      #     physical footprint (phys_footprint, no RSS shared-page double-count)
      #     + a PhysMem total + process count. Ranks the real consumers.
      # Goal: attribute the 7 GB / 3 vCPU pressure to specific processes and
      # bring them down so Harness fits on the standard macos runner.
      - name: Start memory-pressure sampler
        shell: bash
        run: |
          SAMPLE_LOG="$RUNNER_TEMP/mem-pressure.log"
          PROC_LOG="$RUNNER_TEMP/mem-proc.log"
          nohup bash -c 'while true; do echo "=== $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="; sysctl -n vm.swapusage; vm_stat; sleep 2; done' > "$SAMPLE_LOG" 2>&1 &
          echo $! > "$RUNNER_TEMP/mem-sampler.pid"
          nohup bash -c 'while true; do echo "=== $(date -u +%Y-%m-%dT%H:%M:%SZ) nprocs=$(ps -A | wc -l | tr -d " ") ==="; top -l 1 -o mem -n 45 -stats pid,mem,command; sleep 10; done' > "$PROC_LOG" 2>&1 &
          echo $! > "$RUNNER_TEMP/mem-proc.pid"
          echo "pressure sampler PID $(cat "$RUNNER_TEMP/mem-sampler.pid") -> $SAMPLE_LOG"
          echo "process  sampler PID $(cat "$RUNNER_TEMP/mem-proc.pid") -> $PROC_LOG"

      - name: Run React Native Harness
        uses: ./
        with:
          app: ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          runner: ios
          projectRoot: apps/playground
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Stop sampler and summarize memory pressure
        if: always()
        shell: bash
        run: |
          PID="$(cat "$RUNNER_TEMP/mem-sampler.pid" 2>/dev/null || true)"
          if [ -n "$PID" ]; then kill "$PID" 2>/dev/null || true; fi
          PPID_="$(cat "$RUNNER_TEMP/mem-proc.pid" 2>/dev/null || true)"
          if [ -n "$PPID_" ]; then kill "$PPID_" 2>/dev/null || true; fi
          LOG="$RUNNER_TEMP/mem-pressure.log"
          if [ ! -s "$LOG" ]; then echo "no sampler log found"; exit 0; fi

          PAGE=16384
          PEAK_SWAP_M="$(grep -o 'used = [0-9.]*M' "$LOG" | sed 's/used = //; s/M//' | sort -n | tail -1)"
          PEAK_COMP_PAGES="$(grep 'occupied by compressor' "$LOG" | grep -oE '[0-9]+' | sort -n | tail -1)"
          MIN_FREE_PAGES="$(grep 'Pages free' "$LOG" | grep -oE '[0-9]+' | sort -n | head -1)"
          FIRST_SWAPOUT="$(grep 'Swapouts' "$LOG" | head -1 | grep -oE '[0-9]+' | head -1)"
          LAST_SWAPOUT="$(grep 'Swapouts' "$LOG" | tail -1 | grep -oE '[0-9]+' | head -1)"
          PEAK_SWAP_M="${PEAK_SWAP_M:-0}"; PEAK_COMP_PAGES="${PEAK_COMP_PAGES:-0}"
          MIN_FREE_PAGES="${MIN_FREE_PAGES:-0}"; FIRST_SWAPOUT="${FIRST_SWAPOUT:-0}"; LAST_SWAPOUT="${LAST_SWAPOUT:-0}"
          PEAK_COMP_MB=$(( PEAK_COMP_PAGES * PAGE / 1048576 ))
          MIN_FREE_MB=$(( MIN_FREE_PAGES * PAGE / 1048576 ))
          SWAPOUT_DELTA=$(( LAST_SWAPOUT - FIRST_SWAPOUT ))

          {
            echo "### iOS runner memory pressure"
            echo ""
            echo "- Peak swap used: **${PEAK_SWAP_M} MB**"
            echo "- Peak compressed memory: **${PEAK_COMP_MB} MB** (${PEAK_COMP_PAGES} pages)"
            echo "- Min free memory: **${MIN_FREE_MB} MB** (${MIN_FREE_PAGES} pages)"
            echo "- Swapouts during run (delta): **${SWAPOUT_DELTA}**"
            echo "- Runner: macos-latest (3 vCPU / 7 GB), page size ${PAGE} B"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "peak_swap_mb=${PEAK_SWAP_M} peak_compressed_mb=${PEAK_COMP_MB} min_free_mb=${MIN_FREE_MB} swapout_delta=${SWAPOUT_DELTA}"

          # Honest physical footprint: top's PhysMem line (no RSS shared-page
          # double-count). Per-process MEM (phys_footprint) is in the artifact.
          PROC_LOG="$RUNNER_TEMP/mem-proc.log"
          if [ -s "$PROC_LOG" ]; then
            PEAK_PHYS="$(grep -o 'PhysMem: [0-9]*[MG] used' "$PROC_LOG" | grep -oE '[0-9]+[MG]' | awk '/G$/{sub(/G/,"");print $1*1024;next}{sub(/M/,"");print}' | sort -n | tail -1)"
            PEAK_NPROCS="$(grep -oE 'nprocs=[0-9]+' "$PROC_LOG" | grep -oE '[0-9]+' | sort -n | tail -1)"
            {
              echo "- Peak physical memory used (top PhysMem): **${PEAK_PHYS:-?} MB**"
              echo "- Peak process count: **${PEAK_NPROCS:-?}**"
              echo "- Per-process physical footprint (top MEM) in artifact \`mem-proc.log\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "peak_phys_mb=${PEAK_PHYS:-0} peak_nprocs=${PEAK_NPROCS:-0}"
          fi

      - name: Upload memory samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mem-pressure-e2e-ios
          path: |
            ${{ runner.temp }}/mem-pressure.log
            ${{ runner.temp }}/mem-proc.log
            ${{ runner.temp }}/host-proc-before.log
            ${{ runner.temp }}/host-proc-after.log
          if-no-files-found: warn

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-logs-e2e-ios
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-diagnostics-e2e-ios
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  e2e-web:
    name: E2E Web
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'web')) }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Run React Native Harness
        uses: ./
        with:
          runner: chromium
          projectRoot: apps/playground
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-logs-e2e-web
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-diagnostics-e2e-web
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  crash-validate-android:
    name: Crash Validation Android
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android') }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Reclaim disk space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Install pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore APK from cache
        id: cache-apk-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-playground

      - name: Build Android app
        if: steps.cache-apk-restore.outputs.cache-hit != 'true'
        working-directory: apps/playground
        run: |
          pnpm nx run @react-native-harness/playground:build-android --tasks=assembleDebug

      - name: Save APK to cache
        if: steps.cache-apk-restore.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/playground/android/app/build/outputs/apk/debug/app-debug.apk
          key: apk-playground

      - name: Run React Native Harness (expect crash)
        id: crash-test
        continue-on-error: true
        uses: ./
        with:
          app: android/app/build/outputs/apk/debug/app-debug.apk
          runner: android-crash-pre-rn
          projectRoot: apps/playground
          harnessArgs: '--config jest.harness.crash.config.mjs --testPathPatterns src/__tests__/crash/android'
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Verify crash was detected
        shell: bash
        run: |
          if [ "${{ steps.crash-test.outcome }}" != "failure" ]; then
            echo "ERROR: Expected harness to fail (crash not detected)"
            exit 1
          fi
          echo "Crash was correctly detected by the harness"

      - name: Verify crash artifacts exist
        shell: bash
        run: |
          CRASH_DIR="apps/playground/.harness/crash-reports"
          if [ ! -d "$CRASH_DIR" ]; then
            echo "ERROR: No crash report directory found at $CRASH_DIR"
            exit 1
          fi

          ARTIFACT_COUNT="$(find "$CRASH_DIR" -mindepth 4 -type f | wc -l | tr -d ' ')"
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "ERROR: No nested crash report artifacts found in $CRASH_DIR"
            find "$CRASH_DIR" -maxdepth 4 -print
            exit 1
          fi

          echo "Crash report artifacts found:"
          find "$CRASH_DIR" -mindepth 4 -type f -print

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-logs-crash-validate-android
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-diagnostics-crash-validate-android
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore

  crash-validate-ios:
    name: Crash Validation iOS
    runs-on: macos-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios') }}
    env:
      HARNESS_DEBUG: true
      RN_HARNESS_DIAGNOSTICS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Setup Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.4.1'

      - name: Install Watchman
        run: brew install watchman

      - name: Install dependencies
        run: |
          pnpm install

      - name: Build packages
        run: |
          pnpm nx run-many -t build --projects="packages/*"

      - name: Restore app from cache
        id: cache-app-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ./apps/playground/ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          key: ios-app-playground

      - name: CocoaPods cache
        if: steps.cache-app-restore.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ./apps/playground/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: playground-${{ runner.os }}-pods-${{ hashFiles('./apps/playground/ios/Podfile.lock') }}
          restore-keys: |
            playground-${{ runner.os }}-pods-

      - name: Install CocoaPods
        if: steps.cache-app-restore.outputs.cache-hit != 'true'
        working-directory: apps/playground/ios
        run: |
          pod install

      - name: Build iOS app
        if: steps.cache-app-restore.outputs.cache-hit != 'true'
        working-directory: apps/playground
        run: |
          pnpm react-native build-ios --buildFolder ./build --verbose

      - name: Save app to cache
        if: steps.cache-app-restore.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ./apps/playground/ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          key: ios-app-playground

      - name: Run React Native Harness (expect crash)
        id: crash-test
        continue-on-error: true
        uses: ./
        with:
          app: ios/build/Build/Products/Debug-iphonesimulator/HarnessPlayground.app
          runner: ios-crash-pre-rn
          projectRoot: apps/playground
          harnessArgs: '--config jest.harness.crash.config.mjs --testPathPatterns src/__tests__/crash/ios'
          preRunHook: |
            echo "HARNESS_PROJECT_ROOT=$HARNESS_PROJECT_ROOT"
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
          afterRunHook: |
            echo "HARNESS_RUNNER=$HARNESS_RUNNER"
            echo "HARNESS_EXIT_CODE=$HARNESS_EXIT_CODE"

      - name: Verify crash was detected
        shell: bash
        run: |
          if [ "${{ steps.crash-test.outcome }}" != "failure" ]; then
            echo "ERROR: Expected harness to fail (crash not detected)"
            exit 1
          fi
          echo "Crash was correctly detected by the harness"

      - name: Verify crash artifacts exist
        shell: bash
        run: |
          CRASH_DIR="apps/playground/.harness/crash-reports"
          if [ ! -d "$CRASH_DIR" ]; then
            echo "ERROR: No crash report directory found at $CRASH_DIR"
            exit 1
          fi

          ARTIFACT_COUNT="$(find "$CRASH_DIR" -mindepth 4 -type f | wc -l | tr -d ' ')"
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "ERROR: No nested crash report artifacts found in $CRASH_DIR"
            find "$CRASH_DIR" -maxdepth 4 -print
            exit 1
          fi

          echo "Crash report artifacts found:"
          find "$CRASH_DIR" -mindepth 4 -type f -print

      - name: Upload Harness logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-logs-crash-validate-ios
          path: apps/playground/.harness/logs
          if-no-files-found: ignore

      - name: Upload Harness diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-diagnostics-crash-validate-ios
          path: apps/playground/.harness/diagnostics
          if-no-files-found: ignore
