pre-commit:
  parallel: true
  commands:
    lint:
      run: pnpm nx affected -t lint --uncommitted --outputStyle=static

    typecheck:
      run: pnpm nx affected -t typecheck --uncommitted

pre-push:
  commands:
    build-and-test:
      run: pnpm nx affected -t build test --base=origin/main --head=HEAD --outputStyle=static
